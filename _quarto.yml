project:
  type: website
  output-dir: _site

website:
  title: "Mobility Health Observatory"
  site-url: "https://mobility.insightsforaction.uk"
  description: "Synthetic exposure, safety, and health analytics across Great Britain"
  favicon: images/logo.png

  navbar:
    logo: images/logo.png
    background: primary
    search: true
    left:
      - href: index.qmd
        text: Home
      - href: pages/benchmarking-trends.qmd
        text: Benchmarking & Trends
      - href: pages/spatial-risk.qmd
        text: Spatial Risk & Exposure
      - href: pages/data-validation.qmd
        text: Data Linkage & Validation
      - href: approach.qmd
        text: Our Standards
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: https://github.com/phewson/mho-website

format:
  html:
    theme: pulse
    toc: true
    toc-depth: 3
    code-fold: true
    code-summary: "Show code"
    fig-align: center

execute:
  freeze: auto  # Pre-renders chunks so builds stay fast
